<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>별빛스프</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2Q12 12 22 12Q12 12 12 22Q12 12 2 12Q12 12 12 2Z" fill="currentColor"/></svg>
      별빛스프
    </div>
    <nav class="progress" id="progress" aria-label="동화 진행 상황"></nav>
  </header>

  <main class="stage" id="stage"></main>

  <nav class="controls" id="controls" aria-label="페이지 이동">
    <button type="button" class="btn btn-ghost btn-prev" id="btn-prev" aria-label="이전 장면">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="btn-prev-label">이전</span>
    </button>
    <button type="button" class="btn btn-primary" id="btn-next">다음</button>
  </nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="alertdialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-msg">
    <h2 id="modal-title"></h2>
    <p id="modal-msg"></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="modal-cancel">취소</button>
      <button type="button" class="btn btn-primary" id="modal-ok">확인</button>
    </div>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/story.js"></script>
<script src="js/main.js"></script>
</body>
</html>
